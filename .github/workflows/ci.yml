name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff check
        run: uvx --from "ruff>=0.6" ruff check .
      - name: ruff format --check
        run: uvx --from "ruff>=0.6" ruff format --check .

  test:
    name: Test — py ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      # The package is pure-Python and stdlib-only, so the wheel is
      # `py3-none-any` — one artifact for every OS and arch. The matrix
      # exercises each supported Python minor (syntax / typing / stdlib
      # differences) plus one macOS run to catch path / filesystem
      # assumptions. The library has no OS-specific code paths, so a
      # full OS × Python grid would add no meaningful coverage.
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (editable) with dev extras
        run: uv pip install --system -e ".[dev]"
      - name: Run pytest
        run: pytest -q

  package:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
