[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name (PyPI). The generic `workflow` is taken on PyPI and doesn't
# match the repo, so the published package is `blemees-workflow` (#14). The
# import package and `workflow` console command are intentionally left as-is;
# renaming the import package is a larger, publish-time change tracked in #5.
name = "blemees-workflow"
version = "0.1.0"
description = "The canonical operation mechanism for agent-driven state machine workflows. Implements the framework defined in agent-workflow-skill-creator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "heldcrafthq" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
workflow = "workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["workflow.egg-info"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use `assert` and don't need full type rigor.
"tests/**" = ["B011"]
